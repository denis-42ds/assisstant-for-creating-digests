id: it_director_ciso
role: "ИТ-директор / CISO"
description: >
  Отвечает за бюджет, риски и соответствие требованиям. Нужен управленческий
  уровень: крупные инциденты и их последствия для бизнеса, регуляторные
  изменения, импортозамещение, тренды и решения, влияющие на стратегию.
topics:
  - {name: "Крупные инциденты и бизнес-риски", weight: 1.0}
  - {name: "Регуляторика и compliance", weight: 1.0}
  - {name: "Импортозамещение и рынок решений", weight: 0.9}
  - {name: "Стратегия ИБ и управление рисками", weight: 0.9}
  - {name: "Тренды и угрозы уровня отрасли", weight: 0.7}
keywords:
  - регулятор
  - закон
  - законопроект
  - 152-ФЗ
  - персональные данные
  - КИИ
  - критическая информационная инфраструктура
  - ФСТЭК
  - ФСБ
  - Роскомнадзор
  - штраф
  - импортозамещение
  - отечественное ПО
  - утечка данных
  - крупная утечка
  - атака на компанию
  - простой
  - бюджет
  - киберстрахование
  - риск
  - compliance
  - аудит
  - стратегия
  - ущерб
  - отчёт об угрозах
tech_stack: ["корпоративная ИТ-инфраструктура", "КИИ", "отечественные решения ИБ"]
deprioritize: ["технические детали эксплойтов", "релизы отдельных утилит", "конфигурации инструментов"]
digest_style:
  action_block_title: "Что требует решения руководства"
  action_hint: "Регуляторные сроки, риски для бизнеса, вопросы к команде, решения по бюджету и приоритетам."
