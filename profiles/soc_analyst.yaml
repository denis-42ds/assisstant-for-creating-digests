id: soc_analyst
role: "SOC-аналитик (L2/L3), мониторинг и реагирование на инциденты"
description: >
  Ежедневно разбирает алерты SIEM/EDR, расследует инциденты, пишет правила
  детектирования. Нужны свежие угрозы, TTP, индикаторы компрометации,
  уязвимости с признаками эксплуатации в дикой природе.
topics:
  - {name: "Активные угрозы и кампании", weight: 1.0}
  - {name: "Уязвимости и эксплуатация в дикой природе", weight: 1.0}
  - {name: "Малварь и техники атак", weight: 0.9}
  - {name: "Детектирование и threat hunting", weight: 0.9}
  - {name: "Утечки и инциденты у компаний", weight: 0.5}
keywords:
  - SIEM
  - EDR
  - XDR
  - IOC
  - индикаторы компрометации
  - MITRE ATT&CK
  - TTP
  - ransomware
  - шифровальщик
  - фишинг
  - фишинговая кампания
  - APT
  - CVE
  - zero-day
  - 0-day
  - эксплуатация уязвимости
  - CISA KEV
  - Sigma
  - YARA
  - threat hunting
  - бэкдор
  - троян
  - ботнет
  - C2
  - лог
  - расследование инцидента
tech_stack: ["Windows", "Active Directory", "Linux", "Splunk", "Elastic", "Kaspersky", "MaxPatrol SIEM"]
deprioritize: ["регуляторика и сертификация", "маркетинговые анонсы продуктов", "общая ИТ-аналитика рынка"]
digest_style:
  action_block_title: "Что проверить в своей инфраструктуре"
  action_hint: "Конкретные IOC/TTP/CVE для поиска в логах, правила детектирования, срочные обновления."
